[project]
name = "auto-form"
version = "0.1.0"
description = "AI-powered form filler for internal systems"
requires-python = ">=3.13"
dependencies = [
    "browser-use>=0.12.6",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
fill = "fill:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --tb=short"

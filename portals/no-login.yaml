# Portals with no login that reached an application form in the dry runs of
# 2026-11-15 and 2026-11-16. Default list of the Docker image (--systems overrides).
sources:
- name: coding_job_board
  url: https://www.codingjobboard.com/
  search_url: https://www.codingjobboard.com/?remote=true
  description: 'Coding Job Board aggregates programming jobs and supports a remote=true filter.

    '
  search_instructions: Browse all listed roles with the remote filter. Click each job post and verify
    it is active before applying.
  application_notes: 'Open original job posts and verify they are active before applying.

    '
